<svg xmlns="http://www.w3.org/2000/svg" width="480" height="32" viewBox="0 0 480 32">
  <style>
    @font-face { font-family: "Widgets Sans"; font-weight: 100 900; src: url(data:font/woff2;base64,) format("woff2"); }
    text { font-family: "Widgets Sans", "DIN Next", "DIN Pro", "DIN 2014", Bahnschrift, "Noto Sans JP", "Noto Sans", sans-serif; }
    .key { fill: #2b3a67; } .sub { fill: #8c93a8; }
    .key-s { stroke: #2b3a67; fill: none; } .sub-s { stroke: #8c93a8; fill: none; }
    .name { font-size: 26px; font-weight: 400; letter-spacing: 0.04em; }
    .num { font-size: 28px; font-weight: 300; }
    .label { font-size: 11px; letter-spacing: 0.08em; }
    @media (prefers-color-scheme: dark) {
      .key { fill: #a5b4fc; } .sub { fill: #5d6480; }
      .key-s { stroke: #a5b4fc; } .sub-s { stroke: #5d6480; }
    }
    @keyframes fade { from { opacity: 0; } }
    @keyframes rise { from { opacity: 0; transform: translateY(4px); } }
    @keyframes grow { from { transform: scaleX(0); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect x="0" y="4" width="456.8" height="1.5" class="key" opacity="1" style="animation: grow 960.224558050645ms cubic-bezier(.2,.7,.2,1) 0ms both; transform-box: fill-box; transform-origin: left center;"/>
  <rect x="458.8" y="4" width="19.2" height="1.5" class="key" opacity="0.8" style="animation: grow 139.77544194935498ms cubic-bezier(.2,.7,.2,1) 860ms both; transform-box: fill-box; transform-origin: left center;"/>
  <text x="0" y="26" class="label sub" style="animation: fade 700ms cubic-bezier(.2,.7,.2,1) 700ms both;">JavaScript 96%   ·   CSS 4%</text>
</svg>
