<svg xmlns="http://www.w3.org/2000/svg" width="480" height="62" viewBox="0 0 480 62">
  <style>
    @font-face { font-family: "Widgets Sans"; font-weight: 100 900; src: url(data:font/woff2;base64,) format("woff2"); }
    text { font-family: "Widgets Sans", "DIN Next", "DIN Pro", "DIN 2014", Bahnschrift, "Noto Sans JP", "Noto Sans", sans-serif; }
    .key { fill: #2b3a67; } .sub { fill: #8c93a8; }
    .key-s { stroke: #2b3a67; fill: none; } .sub-s { stroke: #8c93a8; fill: none; }
    .name { font-size: 26px; font-weight: 400; letter-spacing: 0.04em; }
    .num { font-size: 28px; font-weight: 300; }
    .label { font-size: 11px; letter-spacing: 0.08em; }
    @media (prefers-color-scheme: dark) {
      .key { fill: #a5b4fc; } .sub { fill: #5d6480; }
      .key-s { stroke: #a5b4fc; } .sub-s { stroke: #5d6480; }
    }
    @keyframes fade { from { opacity: 0; } }
    @keyframes rise { from { opacity: 0; transform: translateY(4px); } }
    @keyframes grow { from { transform: scaleX(0); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <text x="0" y="30" class="num key" style="animation: rise 700ms cubic-bezier(.2,.7,.2,1) 0ms both;">2</text>
  <text x="0" y="54" class="label sub" style="animation: fade 700ms cubic-bezier(.2,.7,.2,1) 200ms both;">repos</text>
  <text x="96" y="30" class="num key" style="animation: rise 700ms cubic-bezier(.2,.7,.2,1) 120ms both;">0</text>
  <text x="96" y="54" class="label sub" style="animation: fade 700ms cubic-bezier(.2,.7,.2,1) 320ms both;">stars</text>
  <text x="192" y="30" class="num key" style="animation: rise 700ms cubic-bezier(.2,.7,.2,1) 240ms both;">1</text>
  <text x="192" y="54" class="label sub" style="animation: fade 700ms cubic-bezier(.2,.7,.2,1) 440ms both;">followers</text>
  <text x="288" y="30" class="num key" style="animation: rise 700ms cubic-bezier(.2,.7,.2,1) 360ms both;">69</text>
  <text x="288" y="54" class="label sub" style="animation: fade 700ms cubic-bezier(.2,.7,.2,1) 560ms both;">contribs / yr</text>
  <text x="384" y="30" class="num key" style="animation: rise 700ms cubic-bezier(.2,.7,.2,1) 480ms both;">2021</text>
  <text x="384" y="54" class="label sub" style="animation: fade 700ms cubic-bezier(.2,.7,.2,1) 680ms both;">since</text>
</svg>
